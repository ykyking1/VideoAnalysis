name: iha-video-search

# Altyapi servisleri. GPU is yukleri (Temporal worker, vLLM) ayri profillerde -
# varsayilan `docker compose up -d` sadece veri katmanini ayaga kaldirir,
# modelleri host'ta (kendi venv'inizde) calistirirsiniz. Her seyi konteynerde
# istiyorsaniz: `docker compose --profile gpu up -d`.

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      # Kafka bildirim hedefi ("primary"). scripts/setup_minio_notifications.py
      # bu hedefi raw bucket'a baglar; boylece bucket'a dusen video ingest'i
      # otomatik tetikler (proje-ozeti.md §3.1).
      MINIO_NOTIFY_KAFKA_ENABLE_primary: "on"
      MINIO_NOTIFY_KAFKA_BROKERS_primary: "kafka:9092"
      MINIO_NOTIFY_KAFKA_TOPIC_primary: ${KAFKA_TOPIC:-video-ingest}
    depends_on:
      - kafka
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC (toplu yazim icin bunu kullaniyoruz)
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
      # Uretim olceginde (~540M vektor) indeksleme esigini yukseltmek toplu
      # yazim sirasinda gereksiz yeniden indekslemeyi onler.
      QDRANT__STORAGE__OPTIMIZERS__INDEXING_THRESHOLD_KB: "20000"
    volumes:
      - qdrant_data:/qdrant/storage
    # NOT: Qdrant imajinda wget/curl yok - healthcheck tanimlanmadi.

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-videoanalysis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/postgres_state.sql:/docker-entrypoint-initdb.d/10-app-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data

  temporal:
    image: temporalio/auto-setup:latest
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml

  temporal-ui:
    image: temporalio/ui:latest
    depends_on:
      - temporal
    ports:
      - "8080:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"

  # --- GPU profili (opsiyonel) ---
  # Sorgu ayristirma + caption + rerank icin OpenAI-uyumlu vLLM sunucusu.
  # Tek GPU'da hem embedding worker'i hem vLLM calistirmak VRAM'i boler -
  # 4060 sinifi tek kartta once ingest'i bitirip sonra sorgu tarafini
  # ayaga kaldirmak daha pratik.
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    ports:
      - "8000:8000"
    command: >
      --model ${PARSE_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --guided-decoding-backend xgrammar
      --gpu-memory-utilization 0.85
      --max-model-len 8192
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

volumes:
  minio_data:
  qdrant_data:
  postgres_data:
  kafka_data:
  hf_cache:
