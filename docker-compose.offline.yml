# Internetsiz kurulum icin override. Tum imajlar `docker load` ile yerel
# olarak yuklendikten SONRA kullanilir - `pull_policy: never` Docker'in
# internete cikip imaji cekmeye CALISMASINI bile engeller (aksi halde
# yerel imaj eksikse/etiket uyusmazsa sessizce internete cikmaya calisip
# internetsiz makinede anlasilmasi zor bir timeout'ta takilir).
#
# Kullanim:
#     docker compose -f docker-compose.yml -f docker-compose.offline.yml up -d
# (scripts/setup.sh --offline bunu otomatik yapar)
services:
  minio:
    pull_policy: never
  qdrant:
    pull_policy: never
  postgres:
    pull_policy: never
  kafka:
    pull_policy: never
  temporal:
    pull_policy: never
  temporal-ui:
    pull_policy: never
  vllm:
    pull_policy: never
    # Online modda vllm HF Hub'dan (ya da adi HF-ID olan PARSE_MODEL'den)
    # ceker. Offline'da yerelde indirilmis agirliklari (prepare_offline_bundle*
    # ile) bind-mount ediyoruz ve --served-model-name ile MUSTERI TARAFININ
    # gordugu model adini (config.PARSE_MODEL, common/llm.py'nin istek govdesine
    # koydugu "model" alani) HF-ID olarak SABIT tutuyoruz - aksi halde .env'deki
    # PARSE_MODEL yerel bir yol olursa, vllm o yolu served-model-name sanir ama
    # Python istemcisi de ayni yolu "model" olarak gonderdigi icin GENELDE calisir
    # GIBI gorunur; asil sorun PARSE_MODEL container icinde GORULEMEYEN bir HOST
    # yolu oldugunda (`--model <host-yolu>`) vllm modeli hic bulamaz. Bu yuzden
    # .env'de PARSE_MODEL'i HF-ID olarak BIRAKIN (degistirmeyin), gercek agirlik
    # yolunu OFFLINE_BUNDLE_DIR ile verin.
    environment:
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${OFFLINE_BUNDLE_DIR:-.}/models/parse:/models/parse:ro
    command: >
      --model /models/parse
      --served-model-name ${PARSE_MODEL:-Qwen/Qwen2.5-7B-Instruct-AWQ}
      --guided-decoding-backend xgrammar
      --gpu-memory-utilization 0.85
      --max-model-len 8192
